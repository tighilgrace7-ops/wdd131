<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A responsive picture album featuring the San Diego California Temple of The Church of Jesus Christ of Latter-day Saints.">

    <title>Temple Album | San Diego California Temple</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">

    <script src="scripts/temples.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h2>Temple Album</h2>

        <button id="menu-button" aria-label="open navigation menu" aria-expanded="false">
            ☰
        </button>

        <nav id="navigation">
            <a href="index.html">Home</a>
            <a href="#">Old</a>
            <a href="#">New</a>
            <a href="#">Large</a>
            <a href="#">Small</a>
        </nav>
    </header>

    <main>
        <h1>San Diego California Temple</h1>

        <div class="temple-grid">

            <figure>
                <img src="images/temple-1.jpg" alt="San Diego California Temple exterior">
                <figcaption>San California Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple-2.jpg" alt="San Diego California Temple viewed from the ground with a flower in the foreground">
                <figcaption>Temple with a Flower in the Foreground</figcaption>
            </figure>

            <figure>
                <img src="images/temple-3.jpg" alt="San Diego California Temple viewed from a distance">
                <figcaption>San Diego Temple View from a Distance</figcaption>
            </figure>

            <figure>
                <img src="images/temple-4.jpg" alt="Top view of the San Diego California Temple">
                <figcaption>Top View of San Diego Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple-5.jpg" alt="San Diego California Temple illuminated at night">
                <figcaption>San Diego Temple at Night</figcaption>
            </figure>

            <figure>
                <img src="images/temple-6.jpg" alt="Exterior view of the San Diego California Temple">
                <figcaption>Exterior View of San Diego Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple-7.jpg" alt="San Diego California Temple viewed from outside the gate">
                <figcaption>San Diego Temple Outside the Gate</figcaption>
            </figure>

            <figure>
                <img src="images/temple-8.jpg" alt="Side view of the San Diego California Temple from a short distance">
                <figcaption>Side View of San Diego Temple</figcaption>
            </figure>
            
            <figure>
                <img src="images/temple-9.jpg" alt="San Diego California Temple beside the setting sun">
                <figcaption>San Diego Temple at Sunset</figcaption>
            </figure>

        </div>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span>💐Grace Tighil | 💐Nigeria NG </p>
        <p id="lastModified"></p>
    </footer>

</html>
