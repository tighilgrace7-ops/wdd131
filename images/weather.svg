    <path d="M21 16L27 22 M69 64L75 70 M21 70L27 64 M69 22L75 16"/>
  </g>

  <!-- Sun -->
  <circle cx="48" cy="43" r="23" fill="url(#sun)"/>
  <circle cx="40" cy="34" r="7" fill="#FFFFFF" opacity=".35"/>

