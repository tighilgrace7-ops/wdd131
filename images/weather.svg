

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="160" height="140">
  <defs>
    <radialGradient id="sun" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#FFF9B0"/>
      <stop offset="65%" stop-color="#FFC83D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#B9C9D8"/>
    </linearGradient>
    <linearGradient id="rain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8BE3FF"/>
      <stop offset="100%" stop-color="#168BD2"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#52677A" flood-opacity=".25"/>
    </filter>
  </defs>

  <!-- Sun glow -->
  <circle cx="48" cy="43" r="30" fill="#FFD54F" opacity=".35" filter="url(#glow)"/>

